<style>
  :root{
    --ink:#0a1f3d;
    --ink-rgb:10,31,61;

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{

    font-family:var(--sans-zh);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none}

  /* ---------- 顶部 ---------- */
  header{
    max-width:1560px;margin:0 auto;padding:7vh 5vw 3vh;
    display:flex;flex-direction:column;gap:2.4vh;
  }
  .topline{display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.62}
  .back{display:inline-flex;align-items:center;gap:.6em;transition:opacity .25s}
  .back:hover{opacity:.55}
  h1{font-family:var(--serif-zh);font-weight:600;font-size:clamp(34px,4.4vw,58px);letter-spacing:.02em;line-height:1.15}
  .sub{font-family:var(--serif-en);font-style:italic;font-size:clamp(15px,1.35vw,21px);opacity:.66}
  .lede{max-width:62ch;font-size:clamp(14px,1.05vw,16px);line-height:1.85;opacity:.72}
  .rule{height:1px;background:rgba(var(--paper-rgb),.16);margin:1.2vh 0}

  /* ---------- 筛选 ---------- */
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .chip{
    font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;
    color:rgba(var(--paper-rgb),.72);background:rgba(var(--paper-rgb),.05);
    border:1px solid rgba(var(--paper-rgb),.16);border-radius:100px;
    padding:8px 15px;cursor:pointer;transition:all .25s ease;
  }
  .chip .n{opacity:.5;margin-left:7px;font-size:11px}
  .chip:hover{border-color:rgba(var(--paper-rgb),.38);color:var(--paper)}
  .chip.on{background:rgba(var(--paper-rgb),.92);color:var(--ink);border-color:transparent}
  .chip.on .n{opacity:.55}

  /* ---------- 瀑布流 ---------- */
  main{max-width:1560px;margin:0 auto;padding:2.6vh 5vw 12vh}
  .flow{columns:4;column-gap:18px}
  @media (max-width:1280px){.flow{columns:3}}
  @media (max-width:820px){.flow{columns:2;column-gap:12px}}
  @media (max-width:520px){
    .flow{columns:1}
    .filters{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;scrollbar-width:none}
    .filters::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto;min-height:38px}
    header{padding:6vh 6vw 2.4vh}
    main{padding:2vh 6vw 10vh}
  }
  .ph{
    break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;
    margin:0 0 18px;position:relative;
  }
  .ph.hide{display:none}
  .ph img{
    display:block;width:100%;height:auto;border-radius:3px;
    background:rgba(var(--paper-rgb),.05);
    transition:filter .45s ease,transform .55s cubic-bezier(.2,.7,.2,1);
    filter:saturate(.92) contrast(1.02);
  }
  .ph:hover img{filter:saturate(1.05) contrast(1.06) brightness(1.04);transform:scale(1.012)}
  .ph figcaption{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;line-height:1.6;
    opacity:.7;padding:8px 1px 0;transition:opacity .3s;
  }
  .ph:hover figcaption{opacity:.95}
  @media (max-width:820px){.ph figcaption{font-size:11px}}

  /* ---------- 灯箱 ---------- */
  #lb{
    position:fixed;inset:0;z-index:100;display:none;
    background:rgba(4,10,20,.94);backdrop-filter:blur(6px);
    align-items:center;justify-content:center;padding:4vh 4vw;cursor:zoom-out;
  }
  #lb.on{display:flex}
  #lb img{max-width:100%;max-height:88vh;border-radius:2px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
  #lb .cap{
    position:absolute;left:0;right:0;bottom:3vh;text-align:center;
    font-family:var(--mono);font-size:12px;letter-spacing:.06em;opacity:.7
  }

<script>
  // 分组筛选
  var chips = document.querySelectorAll('.chip');
  var phs = document.querySelectorAll('.ph');
  chips.forEach(function(c){
    c.addEventListener('click', function(){
      chips.forEach(function(x){ x.classList.remove('on'); });
      c.classList.add('on');
      var f = c.dataset.f;
      phs.forEach(function(p){
        p.classList.toggle('hide', f !== 'all' && p.dataset.g !== f);
      });
    });
  });

  // 灯箱
  var lb = document.getElementById('lb');
  var lbImg = lb.querySelector('img');
  var lbCap = lb.querySelector('.cap');
  document.querySelectorAll('.ph').forEach(function(p){
    p.addEventListener('click', function(){
      var img = p.querySelector('img');
      lbImg.src = img.src;
      lbImg.alt = img.alt;
      lbCap.textContent = p.querySelector('figcaption').textContent;
      lb.classList.add('on');
    });
  });
  lb.addEventListener('click', function(){ lb.classList.remove('on'); lbImg.src=''; });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ lb.classList.remove('on'); lbImg.src=''; } });
</script>
